<html>
<head><meta charset="utf-8"><title>Temple example</title></head>
<body>

<slot src="./style.css" type="css" />

<main>
  <p class="eyebrow">TEMPLE / A SMALL START</p>
  <h1>Small components. Native HTML.</h1>
  <p>Two instances of one child component, with their own scoped styles.</p>
  <section class="cards">
    <slot src="./components/child.html" />
    <slot src="./components/child.html" />
  </section>
  <footer>TypeScript + HTML + CSS. No virtual DOM.</footer>
</main>

<slot src="./scripts.ts" type="script" />

</body>
</html>
