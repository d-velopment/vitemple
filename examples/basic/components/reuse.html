<style>
    .page {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 8px;
        background-color: #405d30;
        color: white;
        text-decoration: none;
        cursor: pointer;
    }

    .page:hover {
        background-color: #2c4420;
    }
    .page.selected {
        background-color: #1769ff;
        box-shadow: 0 0 0 3px rgba(23, 105, 255, .2);
    }
</style>

<section data-fragment="{id}" data-value="{value}">
    <span class="page">{value}</span>
</section>

<script>
    // Keep every page fragment synchronized with the selected page in the store.
    const pages = document.querySelectorAll('[data-fragment="{id}"]');
    pages.forEach((fragment) => {
        const page = fragment;
        const value = fragment.dataset.value;

        const element = page.querySelector('.page');
        if (element) {
            element.textContent = value;
            element.addEventListener('click', (event) => {
                if (value !== undefined) store.update((state) => ({ ...state, selectedPage: value }));
            });
        }
    });

    // Mark the selected page based on the store's state.
    store.subscribe((state) => {
        pages.forEach((page) => {
            page.querySelector('.page')?.classList.toggle('selected', page.dataset.value === state.selectedPage);
        });
    });
</script>
