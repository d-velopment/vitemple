<style>
  article {
    padding: 28px;
    border: 1px solid #d9dfd5;
    border-radius: 18px;
    background-color: #f9f9f9;
    transition: background-color .5s ease-in-out;
  }

  .avatar {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #e8eddf;
    color: #405d30;
    font-weight: 700;
  }

  h2 {
    margin: 20px 0 6px;
    font-size: 24px;
  }

  p {
    color: #626b5c;
  }

  button {
    margin-top: 18px;
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    color: white;
    background: #405d30;
    cursor: pointer;
  }

  button:hover {
    background: #2c4420;
  }
</style>

<article id="{id}">
  <span class="avatar">T</span>
  <h2>{test}</h2>
  <p>This fragment was inserted as HTML.</p>
  <button type="button" onclick="this.textContent='Again'">Toggle</button>
</article>

<script>
  console.log('This is a scoped script {id}');
  const article = document.getElementById('{id}');
  const button = article?.querySelector('button');
  button?.addEventListener('click', () => {
    article.classList.toggle('{id}');
  });
</script>
